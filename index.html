<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Smart_Room-IoT</title>
   <link rel="icon" type="image/x-icon" href="favicon.ico">
   <link rel="apple-touch-icon" sizes="180x180" href="https://img1.pic.in.th/images/apple-touch-icon298e2b1e47d42002.png">
   <link rel="icon" type="image/png" sizes="32x32" href="https://img1.pic.in.th/images/apple-touch-icon298e2b1e47d42002.png">
   <link rel="icon" type="image/png" sizes="16x16" href="https://img1.pic.in.th/images/apple-touch-icon298e2b1e47d42002.png">
  <!-- ฟอนต์ Prompt และ ไอคอน Material Symbols จาก Google -->
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,1,0" />
  
  <!-- นำเข้า Firebase JS SDK -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #f5f7fa 0%, #e4e8f0 100%);
      --card-bg: rgba(255, 255, 255, 0.9);
      --text-dark: #1e293b;
      --text-muted: #64748b;
      --color-temp: #ff7e67;
      --color-hum: #4facfe;
      --btn-off-bg: #e2e8f0;
      --btn-off-icon: #94a3b8;
      --btn-on-bg: #10b981;
      --btn-on-icon: #ffffff;
      --card-shadow: 0 12px 24px rgba(0, 0, 0, 0.04);
    }

    * { box-sizing: border-box; font-family: 'Prompt', sans-serif; -webkit-tap-highlight-color: transparent; }
    
    body { 
      background: var(--bg-gradient); 
      margin: 0; 
      padding: 0; 
      min-height: 100vh;
      display: flex; 
      justify-content: center; 
      align-items: flex-start;
      color: var(--text-dark);
    }

    .app-container {
      width: 100%;
      max-width: 420px;
      padding: 30px 20px;
    }

    /* ส่วนหัว */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
    }
    
    .header-title {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 1.5rem;
      font-weight: 600;
      margin: 0;
    }

    .status-pill {
      display: flex;
      align-items: center;
      gap: 5px;
      background: #d1fae5;
      color: #059669;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 500;
    }
    .status-pill .material-symbols-rounded { font-size: 14px; }

    /* วิดเจ็ตเซ็นเซอร์ */
    .sensor-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
      margin-bottom: 20px;
    }

    .widget-card {
      background: var(--card-bg);
      padding: 20px;
      border-radius: 24px;
      box-shadow: var(--card-shadow);
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      transition: transform 0.2s ease;
    }

    .widget-icon {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 15px;
    }
    .icon-temp { background: rgba(255, 126, 103, 0.15); color: var(--color-temp); }
    .icon-hum { background: rgba(79, 172, 254, 0.15); color: var(--color-hum); }

    .widget-value {
      font-size: 2rem;
      font-weight: 600;
      margin-bottom: 2px;
      line-height: 1;
    }
    
    .widget-label {
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    /* วิดเจ็ตควบคุมไฟ */
    .control-card {
      background: var(--card-bg);
      padding: 30px 20px;
      border-radius: 24px;
      box-shadow: var(--card-shadow);
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .control-header {
      font-size: 1.1rem;
      font-weight: 500;
      margin-bottom: 25px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .main-btn {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      border: none;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 0 8px 16px rgba(0,0,0,0.05);
    }

    .main-btn .material-symbols-rounded {
      font-size: 48px;
      transition: color 0.3s;
    }

    .main-btn:active { transform: scale(0.92); }

    .btn-off {
      background: var(--btn-off-bg);
    }
    .btn-off .material-symbols-rounded { color: var(--btn-off-icon); }

    .btn-on {
      background: var(--btn-on-bg);
      box-shadow: 0 12px 24px rgba(16, 185, 129, 0.3);
    }
    .btn-on .material-symbols-rounded { color: var(--btn-on-icon); }

    .status-text {
      margin-top: 20px;
      font-size: 0.95rem;
      color: var(--text-muted);
      font-weight: 500;
    }
  </style>
</head>
<body>

  <div class="app-container">
    
    <!-- ส่วนหัว -->
    <div class="header">
      <h1 class="header-title">
        <span class="material-symbols-rounded">home_app_logo</span> ห้องนอน
      </h1>
      <div class="status-pill" id="connStatus">
        <span class="material-symbols-rounded">cloud_sync</span> ซิงค์แล้ว
      </div>
    </div>

    <!-- ส่วนแสดงสภาพอากาศ -->
    <div class="sensor-grid">
      <div class="widget-card">
        <div class="widget-icon icon-temp">
          <span class="material-symbols-rounded">device_thermostat</span>
        </div>
        <div class="widget-value"><span id="temp">--</span>°</div>
        <div class="widget-label">อุณหภูมิ</div>
      </div>

      <div class="widget-card">
        <div class="widget-icon icon-hum">
          <span class="material-symbols-rounded">humidity_percentage</span>
        </div>
        <div class="widget-value"><span id="hum">--</span>%</div>
        <div class="widget-label">ความชื้น</div>
      </div>
    </div>

    <!-- ส่วนควบคุมสวิตช์ไฟ -->
    <div class="control-card">
      <div class="control-header">
        ไฟส่องสว่าง
      </div>
      
      <button id="mainBtn" class="main-btn btn-off" onclick="toggleLight()">
        <span class="material-symbols-rounded">lightbulb</span>
      </button>
      
      <div class="status-text" id="relayStatus">กำลังซิงค์ข้อมูล...</div>
    </div>

  </div>

  <script>
    // ==========================================
    // ⚠️ นำข้อมูลจาก Firebase มาใส่ตรงนี้ ⚠️
    // ==========================================
    const firebaseConfig = {
      apiKey: "AIzaSyDZr-2sgP5_JJXbxHem_8hGNFf4bGFP2l8",
      databaseURL: "https://smartroom-iot-d418c-default-rtdb.asia-southeast1.firebasedatabase.app",
    };

    // เปิดใช้งาน Firebase
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    let currentState = "OFF";

    // 1. ดักจับอุณหภูมิ
    db.ref('/room/temp').on('value', (snapshot) => {
      document.getElementById('temp').innerText = snapshot.val() !== null ? snapshot.val().toFixed(1) : "--";
    });

    // 2. ดักจับความชื้น
    db.ref('/room/hum').on('value', (snapshot) => {
      document.getElementById('hum').innerText = snapshot.val() !== null ? snapshot.val().toFixed(1) : "--";
    });

    // 3. ดักจับสถานะไฟและเปลี่ยนหน้าตาปุ่ม
    db.ref('/room/relay').on('value', (snapshot) => {
      currentState = snapshot.val() || "OFF";
      const btn = document.getElementById('mainBtn');
      const statusText = document.getElementById('relayStatus');
      
      if (currentState === "ON") {
        btn.className = "main-btn btn-on";
        statusText.innerHTML = "สถานะ: <strong style='color:#10b981;'>เปิด (ON)</strong>";
      } else {
        btn.className = "main-btn btn-off";
        statusText.innerHTML = "สถานะ: <strong>ปิด (OFF)</strong>";
      }
    });

    // 4. ฟังก์ชันสำหรับกดปุ่ม
    function toggleLight() {
      // สั่นมือถือเบาๆ เมื่อกดปุ่ม (ทำงานบนมือถือที่รองรับ)
      if (navigator.vibrate) navigator.vibrate(50);
      
      const newState = (currentState === "ON") ? "OFF" : "ON";
      db.ref('/room/relay').set(newState);
    }
  </script>
</body>
</html>
